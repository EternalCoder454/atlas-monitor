name: CI

on:
  push:
    branches: [main, beta, minimal]
    # Pages about Atlas rather than Atlas: nothing builds, tests or packages them
    # differently when only these change. README.md is copied into the release
    # archives, but as a file, so its words cannot break a build. CHANGELOG.md
    # is not here: a test checks it has an entry for the current version.
    paths-ignore:
      - README.md
      - CLAUDE.md
      - "screenshots/**"
      - "images/**"
  pull_request:
    paths-ignore:
      - README.md
      - CLAUDE.md
      - "screenshots/**"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build · vet · test
    runs-on: ubuntu-latest
    # About twice the slowest successful run, a cold compile of gotk4 (31 minutes),
    # so a hung test stops within the hour instead of at GitHub's six.
    timeout-minutes: 60
    # Fedora rather than the bare Ubuntu runner: Atlas needs libadwaita >= 1.6
    # for AdwButtonRow, which Ubuntu 24.04 does not ship, and Fedora is what the
    # project targets.
    container: fedora:latest
    # One set of build flags for vet, build and test, so they share one compile
    # of gotk4. `make build` uses -trimpath and Go keys its cache on the flags,
    # so without this a cold run compiled the bindings twice — once for vet,
    # once for the build. See windows.yml, which had the same problem.
    env:
      GOFLAGS: -trimpath
    steps:
      # Split in two so the package cache can be restored between them: the
      # cache action needs tar and zstd, which is why those come first, and the
      # expensive half (gtk4-devel and its dependencies) then comes out of the
      # cache instead of the network.
      - name: Install the cache tools
        id: cachetools
        run: |
          echo "keepcache=1" >> /etc/dnf/dnf.conf
          dnf install -y --setopt=install_weak_deps=False --nodocs tar zstd
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache dnf packages
        uses: actions/cache@v4
        with:
          # Fedora is on dnf5, which keeps its packages under libdnf5; the old
          # path is listed too so this keeps working either way. Caching the
          # wrong one silently saves nothing at all — the run after reports
          # "cache not found" and pays full price again.
          path: |
            /var/cache/libdnf5
            /var/cache/dnf
          # Keyed by the week, so the cache follows Fedora's updates. It used to
          # be keyed on a hash of this file, but this step runs before the
          # checkout, where that hash is empty: the key was always "dnf-fedora-",
          # an exact hit that is never saved again, so the cache stayed the
          # packages of the day it was made and every update since was downloaded
          # on every run. A new week starts from the last one's and saves once.
          key: dnf-fedora-${{ steps.cachetools.outputs.week }}
          restore-keys: dnf-fedora-

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False --nodocs \
            golang gtk4-devel libadwaita-devel glib2-devel \
            gcc pkgconf-pkg-config git make

      - uses: actions/checkout@v5

      # `go build` stamps the binary with the commit, which runs git inside the
      # container as root over a checkout owned by another uid — git refuses
      # that as "dubious ownership" and the build fails. Marking the workspace
      # safe keeps the stamping rather than turning it off with -buildvcs=false.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Record toolchain versions
        run: |
          go version
          echo "gtk4        $(pkg-config --modversion gtk4)"
          echo "libadwaita  $(pkg-config --modversion libadwaita-1)"

      # The gotk4 cgo bindings are large and slow to compile from cold; caching
      # the module and build caches turns a ~4 minute build into seconds. The key
      # includes go-cache.sh because the script decides what the saved cache
      # holds: a change to it saves the cache once more under the new rules.
      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: fedora-go-${{ hashFiles('go.sum', '.github/go-cache.sh') }}
          restore-keys: fedora-go-

      # Go's own cache trim can wreck a restored cache; see the script.
      - name: Hold Go's cache trim
        run: bash .github/go-cache.sh hold

      # Atlas's own code. third_party/ is upstream's, kept as upstream wrote it
      # apart from the one change scripts/vendor-adwaita.sh makes.
      - name: gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' ':!third_party' | xargs -0r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            echo "$unformatted" | xargs gofmt -d
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build (default)
        run: make build

      - name: Build (lean, -tags noai)
        run: make build-lean

      # -count=1 because several suites read this machine's live /proc, /sys and
      # D-Bus; a cached "ok" would hide a real regression.
      - name: Test
        run: go test -count=1 ./...

      # Only the packages the tag can reach. "noai" exists in internal/ui alone,
      # and internal/app is the only thing that imports it, so running the whole
      # suite a second time re-tested a dozen packages the tag cannot change —
      # a minute of CI to prove that /proc parsing is unaffected by whether the
      # assistant is compiled in.
      - name: Test (lean, -tags noai)
        run: go test -count=1 -tags noai ./internal/ui/ ./internal/app/ .

      # Last, so the cache saved after it is what this run used.
      - name: Prune the Go build cache
        run: bash .github/go-cache.sh prune

  race:
    name: race detector
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: fedora:latest
    steps:
      # Split in two so the package cache can be restored between them: the
      # cache action needs tar and zstd, which is why those come first, and the
      # expensive half (gtk4-devel and its dependencies) then comes out of the
      # cache instead of the network.
      - name: Install the cache tools
        id: cachetools
        run: |
          echo "keepcache=1" >> /etc/dnf/dnf.conf
          dnf install -y --setopt=install_weak_deps=False --nodocs tar zstd
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache dnf packages
        uses: actions/cache@v4
        with:
          # Fedora is on dnf5, which keeps its packages under libdnf5; the old
          # path is listed too so this keeps working either way. Caching the
          # wrong one silently saves nothing at all — the run after reports
          # "cache not found" and pays full price again.
          path: |
            /var/cache/libdnf5
            /var/cache/dnf
          # Keyed by the week, so the cache follows Fedora's updates. It used to
          # be keyed on a hash of this file, but this step runs before the
          # checkout, where that hash is empty: the key was always "dnf-fedora-",
          # an exact hit that is never saved again, so the cache stayed the
          # packages of the day it was made and every update since was downloaded
          # on every run. A new week starts from the last one's and saves once.
          key: dnf-fedora-${{ steps.cachetools.outputs.week }}
          restore-keys: dnf-fedora-

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False --nodocs \
            golang gtk4-devel libadwaita-devel glib2-devel \
            gcc pkgconf-pkg-config git make

      - uses: actions/checkout@v5

      # `go build` stamps the binary with the commit, which runs git inside the
      # container as root over a checkout owned by another uid — git refuses
      # that as "dubious ownership" and the build fails. Marking the workspace
      # safe keeps the stamping rather than turning it off with -buildvcs=false.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: fedora-race-${{ hashFiles('go.sum', '.github/go-cache.sh') }}
          restore-keys: fedora-race-

      - name: Hold Go's cache trim
        run: bash .github/go-cache.sh hold

      # The collectors hand samples to the GTK thread through a mutex and a
      # double-buffered slice, so this is the suite that matters most here.
      - name: Test with -race
        run: make test-race

      # This job is a single go command, so nothing after it would rebuild what
      # a trim broke: without the hold and this, the damage is what gets saved.
      - name: Prune the Go build cache
        run: bash .github/go-cache.sh prune
