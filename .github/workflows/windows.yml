name: Windows

# Building Atlas for Windows.
#
# There is no Windows machine to develop this on, so this workflow is the
# feedback loop: it is deliberately noisy, printing what it found and what it
# linked against, because a run of it is the only way to learn whether something
# works.
#
# The toolchain is MSYS2's MINGW64 environment rather than cross-compilation from
# Linux. Fedora packages mingw64-gtk4 but has no mingw64-libadwaita, and Atlas is
# libadwaita throughout — the sidebar, every preferences page, every dialog — so
# cross-compiling would mean building libadwaita and its dependencies by hand.
# MSYS2 ships both.

on:
  push:
    # beta and main are here so the Windows build does not quietly rot once the
    # port lands. It is a slow job — MSYS2 upgrades itself, then cgo compiles the
    # whole of gotk4 — but a platform nothing builds for is a platform that stops
    # working, and nobody would notice until someone downloaded it.
    branches: [windows, beta, main]
  pull_request:
    branches: [windows, beta, main]
  workflow_dispatch:

permissions:
  contents: read

# Each push supersedes the last. These runs take several minutes — MSYS2 upgrades
# itself before installing anything — and a queue of them all building the same
# branch only delays the one whose answer is wanted.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: exe
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # go and gcc from MSYS2 rather than the runner's own: cgo needs the
          # compiler and the Go toolchain to agree about the C runtime, and the
          # GTK libraries here are built against this one.
          # gobject-introspection is a build dependency of the gotk4 bindings
          # themselves. librsvg and the icon theme are runtime ones: every icon
          # Atlas ships is an SVG, and GTK loads those through gdk-pixbuf's rsvg
          # loader, so without it the sidebar comes up with empty squares.
          install: >-
            mingw-w64-x86_64-go
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-gobject-introspection
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-adwaita-icon-theme
            git
            zip

      - name: What we are building against
        run: |
          go version
          gcc --version | head -1
          pkg-config --modversion gtk4
          pkg-config --modversion libadwaita-1

      - name: Trust the checkout
        run: git config --global --add safe.directory "$(pwd)"

      # The non-UI packages first. They compile for Windows without cgo, so a
      # failure here is Atlas's own code and nothing to do with GTK — which makes
      # it much cheaper to diagnose than a link error.
      - name: Build the data packages
        env:
          CGO_ENABLED: 0
        run: |
          go build $( go list ./internal/... 2>/dev/null | grep -vE '/ui$|/graph$|/app$')

      - name: Vet everything for Windows
        env:
          CGO_ENABLED: 1
        run: go vet ./... || true

      # The only automated check the Windows code paths get.
      #
      # It is a named list rather than ./... because most of the suite reads the
      # live /proc and /sys of the machine it runs on, and those tests are scoped
      # to Linux by filename. What is left is the platform-neutral logic plus the
      # Windows mappings: process names, service states, battery status, and what
      # the updater offers. internal/app and internal/ui need cgo and a display, so
      # they are built above rather than tested here — and so is internal/graph, which
      # draws the charts and imports GTK just as they do.
      - name: Test the Windows code paths
        env:
          CGO_ENABLED: 0
        run: |
          go test -count=1 \
            ./internal/winapi/ \
            ./internal/process/ \
            ./internal/power/ \
            ./internal/services/ \
            ./internal/autostart/ \
            ./internal/stats/ \
            ./internal/format/ \
            ./internal/health/ \
            ./internal/config/

      # Build and stage in one step, through the script the release uses, so the
      # two cannot package differently.
      - name: Build and stage the distribution
        id: stage
        env:
          CGO_ENABLED: 1
        run: |
          bash packaging/stage-windows.sh
          echo "name=atlas-monitor-$(cat VERSION)-windows-x86_64" >> "$GITHUB_OUTPUT"

      - name: What it links against
        run: |
          ldd atlas-monitor.exe | sort
          echo "---- count ----"
          ldd atlas-monitor.exe | grep -c mingw64 || true

      # Actually start it.
      #
      # Everything above this is static: it proves the thing links and that the
      # files are in the right places, not that it runs. This launches the console
      # build from the staged folder — the same folder a user would unpack — and
      # sees how far it gets.
      #
      # This gates the build. It was informational to begin with, because a GitHub
      # runner might not give a GUI process a usable window station and an exit
      # would then have been ambiguous. A runner has since started it and held it
      # for twenty seconds with nothing on stderr, so the ambiguity is gone: from
      # here on, exiting early means something is broken.
      - name: Start it
        run: |
          cd "dist/${{ steps.stage.outputs.name }}"
          ./atlas-monitor-console.exe > /tmp/atlas-run.log 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            echo "RESULT: still running after 20 seconds — it started"
            kill "$pid" 2>/dev/null || true
            status=started
          else
            wait "$pid" || true
            echo "RESULT: exited before the 20 seconds were up"
            status=exited
          fi
          if [ "$status" = exited ]; then
            echo "It should have stayed up. Whatever it printed is below."
            cat /tmp/atlas-run.log || true
            exit 1
          fi
          echo "---- what it said ----"
          cat /tmp/atlas-run.log || echo "(nothing on stdout or stderr)"
          echo "---- the failures that would mean the packaging is wrong ----"
          if grep -qiE "entry point|cannot find|not found|No such file" /tmp/atlas-run.log; then
            echo "A LIBRARY DID NOT RESOLVE — the DLL set is incomplete"
            exit 1
          fi
          if grep -qiE "Settings schema|GSettings|gschemas" /tmp/atlas-run.log; then
            echo "GLIB COULD NOT FIND ITS SCHEMAS — the share/glib-2.0 staging is wrong"
            exit 1
          fi
          echo "none of those appeared ($status)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: dist/*.zip*
          if-no-files-found: error
