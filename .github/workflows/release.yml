name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.6.0)"
        required: true

permissions:
  contents: write

jobs:
  tarball:
    name: binary tarball
    runs-on: ubuntu-latest
    # Whatever Fedora this is, the tarball is named after it (rpm -E %fedora),
    # so the artifact always says which release it was built against rather than
    # depending on a pinned tag staying valid.
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            golang gtk4-devel libadwaita-devel glib2-devel \
            gcc pkgconf-pkg-config git tar gzip \
            gh # the runner host has it, the container does not

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # See ci.yml: git refuses a checkout owned by another uid, which breaks
      # the VCS stamping `go build` does.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The tag this build is for. On a tag push that is the ref; on a manual
      # re-run it is the input. github.ref is the branch for a dispatch, which
      # is why the attach step below must not look at it.
      - name: Resolve the tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Named after the tag rather than VERSION, so two builds of the same
          # version stay apart. The Minimal branch carries the same VERSION as
          # the full one on purpose — "Minimal 0.10.0" means the features of
          # 0.10.0 — which left both releases producing a file called
          # atlas-monitor-0.10.0-linux-x86_64-fedora42.tar.gz. Downloaded
          # together, nothing but the directory they landed in told them apart.
          version="${TAG#v}"
          [ -n "$version" ] || version="$(cat VERSION)"
          fedora="$(rpm -E %fedora)"
          name="atlas-monitor-${version}-linux-x86_64-fedora${fedora}"
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "name=$name"         >> "$GITHUB_OUTPUT"

          make build
          # Stage exactly what packaging/install.sh expects to find beside it.
          mkdir -p "dist/$name/assets"
          cp bin/atlas-monitor "dist/$name/"
          cp -r assets/style.css assets/icon.svg assets/icons assets/com.atlas.Monitor.desktop "dist/$name/assets/"
          cp packaging/install.sh README.md LICENSE NOTICE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )

      - name: Record what it links against
        run: |
          echo "Built on Fedora $(rpm -E %fedora)"
          echo "gtk4 $(pkg-config --modversion gtk4), libadwaita $(pkg-config --modversion libadwaita-1)"
          ldd bin/atlas-monitor | grep -E 'gtk|adwaita' || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/*.tar.gz*

      # Attach to the GitHub Release for this tag when one exists. The workflow
      # deliberately does not create a Release itself — publishing one is a
      # decision for whoever is cutting the version, not a side effect of
      # pushing a tag. Without one the tarball is still produced above and kept
      # as a workflow artifact.
      - name: Attach to the release, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          # gh works out the repository from the git remote, which it cannot do
          # reliably inside the container, so name it outright.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tag="$TAG"
          case "$tag" in
            v*) ;;
            *) echo "Not a version tag ($tag); nothing to attach to."; exit 0 ;;
          esac
          # Anything other than "the release is not there yet" is a real
          # failure and should stop the job, not be reported as an absent
          # release — which is how a missing gh looked the first time.
          command -v gh >/dev/null || { echo "gh is not installed in this image"; exit 1; }
          if gh release view "$tag" >/dev/null; then
            gh release upload "$tag" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
            echo "Attached the tarball to release $tag."
          else
            echo "No GitHub Release exists for $tag, so nothing was attached."
            echo "The tarball is available as this run's artifact; publish a"
            echo "release for the tag and re-run to attach it."
          fi
