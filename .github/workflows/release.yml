name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.6.0)"
        required: true

permissions:
  contents: write

jobs:
  tarball:
    name: binary tarball
    runs-on: ubuntu-latest
    # Whatever Fedora this is, the tarball is named after it (rpm -E %fedora),
    # so the artifact always says which release it was built against rather than
    # depending on a pinned tag staying valid.
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            golang gtk4-devel libadwaita-devel glib2-devel \
            gcc pkgconf-pkg-config git tar gzip zstd \
            gh # the runner host has it, the container does not

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The gotk4 bindings, already compiled by CI on main. A cold build of them
      # was 14 of this job's 15 minutes. A tag can read caches saved on the default
      # branch, and CI builds there with the same container and the same
      # `make build`, so this is usually an exact hit. Restore only: a cache saved
      # under a tag is readable by that tag alone, so saving one would be storage
      # for nothing. The paths and key must stay identical to ci.yml's, which is
      # what makes the two caches the same cache.
      - name: Restore the Go build cache from CI
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: fedora-go-${{ hashFiles('go.sum', '.github/go-cache.sh') }}
          restore-keys: fedora-go-

      # Nothing is saved here, but a trim at the end of one go command could
      # still delete what the next one needs. See .github/go-cache.sh.
      - name: Hold Go's cache trim
        run: bash .github/go-cache.sh hold

      # See ci.yml: git refuses a checkout owned by another uid, which breaks
      # the VCS stamping `go build` does.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The tag this build is for. On a tag push that is the ref; on a manual
      # re-run it is the input. github.ref is the branch for a dispatch, which
      # is why the attach step below must not look at it.
      - name: Resolve the tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Named after the tag rather than VERSION, so two builds of the same
          # version stay apart. The Minimal branch carries the same VERSION as
          # the full one on purpose — "Minimal 0.10.0" means the features of
          # 0.10.0 — which left both releases producing a file called
          # atlas-monitor-0.10.0-linux-x86_64-fedora42.tar.gz. Downloaded
          # together, nothing but the directory they landed in told them apart.
          version="${TAG#v}"
          [ -n "$version" ] || version="$(cat VERSION)"
          fedora="$(rpm -E %fedora)"
          name="atlas-monitor-${version}-linux-x86_64-fedora${fedora}"
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "name=$name"         >> "$GITHUB_OUTPUT"

          make build
          # Stage exactly what packaging/install.sh expects to find beside it.
          mkdir -p "dist/$name/assets"
          cp bin/atlas-monitor "dist/$name/"
          cp -r assets/style.css assets/icon.svg assets/icons assets/com.atlas.Monitor.desktop "dist/$name/assets/"
          cp packaging/install.sh README.md LICENSE NOTICE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )

      - name: Record what it links against
        run: |
          echo "Built on Fedora $(rpm -E %fedora)"
          echo "gtk4 $(pkg-config --modversion gtk4), libadwaita $(pkg-config --modversion libadwaita-1)"
          ldd bin/atlas-monitor | grep -E 'gtk|adwaita' || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/*.tar.gz*

      # Attach to the GitHub Release for this tag when one exists. The workflow
      # deliberately does not create a Release itself — publishing one is a
      # decision for whoever is cutting the version, not a side effect of
      # pushing a tag. Without one the tarball is still produced above and kept
      # as a workflow artifact.
      - name: Attach to the release, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          # gh works out the repository from the git remote, which it cannot do
          # reliably inside the container, so name it outright.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tag="$TAG"
          case "$tag" in
            v*) ;;
            *) echo "Not a version tag ($tag); nothing to attach to."; exit 0 ;;
          esac
          # Anything other than "the release is not there yet" is a real
          # failure and should stop the job, not be reported as an absent
          # release — which is how a missing gh looked the first time.
          command -v gh >/dev/null || { echo "gh is not installed in this image"; exit 1; }
          if gh release view "$tag" >/dev/null; then
            gh release upload "$tag" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
            echo "Attached the tarball to release $tag."
          else
            echo "No GitHub Release exists for $tag, so nothing was attached."
            echo "The tarball is available as this run's artifact; publish a"
            echo "release for the tag and re-run to attach it."
          fi

  windows:
    name: windows zip
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    # The same flags and cache locations as windows.yml, so the cache it saves on
    # main is one this job can use. See that file for why they matter.
    env:
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-go
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-gobject-introspection
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-adwaita-icon-theme
            git
            zip

      - name: Trust the checkout
        run: git config --global --add safe.directory "$(pwd)"

      # Go's caches in the runner's temp directory, which is where the cache step
      # saves and restores them. Set here rather than in the job's env because the
      # runner context, and so runner.temp, is not available at that level.
      - name: Put Go's caches where the cache step keeps them
        run: |
          temp="$(cygpath -w "$RUNNER_TEMP")"
          echo "GOCACHE=$temp\\go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$temp\\go-mod" >> "$GITHUB_ENV"

      - name: Toolchain
        id: toolchain
        run: echo "key=$(go env GOVERSION)-gcc$(gcc -dumpversion)-gtk$(pkg-config --modversion gtk4)-adw$(pkg-config --modversion libadwaita-1)" >> "$GITHUB_OUTPUT"

      # The bindings as the Windows workflow last compiled them on main: 18 minutes
      # of this job when built cold. Restore only, for the reason given on the
      # tarball job's cache step.
      - name: Restore the Go build cache from the Windows workflow
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
          key: windows-go-${{ steps.toolchain.outputs.key }}-${{ hashFiles('go.sum', '.github/go-cache.sh') }}
          restore-keys: windows-go-${{ steps.toolchain.outputs.key }}-

      - name: Hold Go's cache trim
        run: bash .github/go-cache.sh hold

      - name: Resolve the tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # The same staging the Windows workflow does, which is where it is explained.
      # Kept as a call into the repository rather than copied, so the two cannot
      # drift: a release that packaged differently from what CI tested would be the
      # worst possible place for that difference to first show up.
      - name: Build and stage
        id: build
        env:
          CGO_ENABLED: 1
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="${TAG#v}"
          [ -n "$version" ] || version="$(cat VERSION)"
          bash packaging/stage-windows.sh "$version"
          echo "name=atlas-monitor-${version}-windows-x86_64" >> "$GITHUB_OUTPUT"

      - name: What it links against
        run: |
          ldd atlas-monitor.exe | grep mingw64 | wc -l | xargs echo "mingw64 DLLs linked:"
          pkg-config --modversion gtk4 libadwaita-1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/*.zip*
          if-no-files-found: error

      # In PowerShell rather than the MSYS2 shell the rest of this job uses.
      # setup-msys2 defaults to path-type: minimal, which deliberately keeps the
      # Windows PATH out — so gh, which lives in Program Files, is not on it. Rather
      # than widen the PATH for the whole job and risk the Windows Go and gcc
      # shadowing MSYS2's, this one step steps outside.
      - name: Attach to the release, if there is one
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if (-not $env:TAG.StartsWith("v")) {
            Write-Host "Not a version tag ($env:TAG); nothing to attach to."
            exit 0
          }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No GitHub Release exists for $env:TAG, so nothing was attached."
            Write-Host "The zip is available as this run's artifact."
            exit 0
          }
          $files = Get-ChildItem dist -Filter *.zip*
          if (-not $files) { throw "nothing in dist to attach" }
          gh release upload $env:TAG $files.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          Write-Host "Attached the Windows zip to release $env:TAG."
